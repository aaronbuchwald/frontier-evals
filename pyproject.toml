[project]
name = "envlab"
version = "0.1.0"
description = "Pipeline for authoring, running, grading and researching RL environment tasks in a Harvey Legal-Agent-Benchmark-style format."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
dev = ["pytest>=8.0"]

[project.scripts]
envlab = "envlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["envlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
