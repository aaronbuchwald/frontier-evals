metadata:
  practice_area: ERISA / employee benefits (health & welfare); CAA 2021 transparency; HIPAA privacy
  task_type: advisory
  difficulty: expert
  edge_case: >
    ERISA § 724 / CAA 2021 Div. BB § 201 prohibits a plan from agreeing to terms that "directly or
    indirectly restrict" electronic access to de-identified claims data on a per-claim basis, but
    prescribes no format, delivery mechanism, timing or price. The TPA argues that portal access
    plus paid, delayed custom extracts and a consent right over third-party sharing are
    commercial terms, not restrictions, and that a savings clause cures everything; it then
    offers a "standard CAA amendment" that fixes the obvious problems (consent, 180 days,
    per-line pricing) while re-creating the restrictions in subtler forms (provider-key masking
    labelled as de-identification, a notice-and-objection right that withholds delivery, a
    two-per-year frequency cap and 24-month lookback, a partial fix to the data use agreement,
    a § 724 "acknowledgment", a release of Plan claims, and effectiveness conditioned on the
    carrier affiliate's consent). The associate must separate the clear violations from the
    genuinely unsettled terms (fees, lags, standard formats), credit the amendment's acceptable
    commercial elements rather than rejecting it wholesale, trace the restriction upstream to
    the carrier affiliate's network-license agreement, get the attestation (including
    attestation-period) and IRC § 4980D mechanics right, structure the data flow so it is lawful
    under both § 724 and HIPAA (the request as drafted is not safe-harbor de-identified; the
    plan document limits PHI to the sponsor; the audit needs full-date data that § 724 does not
    itself guarantee), and avoid the de-identification, change-in-law and "Meridian is the
    violator" traps - while also catching the consultant's own conflict and ERISA
    § 408(b)(2)(B) disclosure issue and the Cordell-era data gap.
  author: envlab (seed task; revised iter2)
  source_idea: ideas/nsa-gag-clause.md
  target_max_pass_rate: 0.75
  min_criteria: 10
  notes: >
    Dates assume the matter is live in mid-October 2026 (memo date on or about October 17,
    2026). Parties are fictional. The statutory excerpt is provided; the Departments' FAQ
    guidance (Parts 57 and 69), the IRC § 4980D mechanics, ERISA § 408(b)(2)(B) and the HIPAA
    de-identification / plan-sponsor rules are deliberately not provided and must come from the
    associate's own knowledge. Iteration 2 changes - re-sequenced the September correspondence
    so it post-dates the Northgate letter; added document 13 (Meridian's proposed amendment)
    and thirteen criteria that turn on it; split the former format/calibration criterion;
    merged the overlapping 9.3 / "proprietary" criteria; added attestation-period and
    § 4980D(b)(3) criteria; tightened grader notes per QA review.
