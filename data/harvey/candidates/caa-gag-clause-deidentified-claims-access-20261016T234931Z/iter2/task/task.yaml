id: caa-gag-clause-deidentified-claims-access
title: Gag clause prohibition - TPA limits on access to de-identified claims data (Halvorsen / Meridian)
package: harvey
instruction: |
  Halvorsen's General Counsel needs our advice before the Benefits Committee meets on
  October 28. Review the Meridian administrative services agreement, Meridian's proposed
  amendment, and the other materials in the matter folder. Prepare a memo to Dana Okafor
  analyzing whether the Meridian arrangement contains gag clauses prohibited under the
  Consolidated Appropriations Act, how Halvorsen should handle Northgate's data request and the
  proposed claims audit, what to do about the gag clause attestations already filed and the one
  due December 31, the Plan's realistic exposure, whether to sign Meridian's proposed amendment,
  and the amendment and negotiating approach we recommend. Flag any other fiduciary issues the
  Committee should consider. Executive summary first.
deliverables:
  - memo.md
