criteria:
- id: c01
  category: citation
  deliverable: memo.md
  text: Identifies ERISA section 724 (29 U.S.C. 1185m), enacted by section 201 of Division BB of the Consolidated Appropriations Act, 2021, as the provision that governs Halvorsen's self-funded ERISA plan (references to the parallel PHSA 2799A-9 / IRC 9824 provisions are acceptable in addition, but a memo that relies only on the PHSA or on "the No Surprises Act" without identifying the ERISA provision fails).
  grader_notes: The citation must be to ERISA 724 / 29 USC 1185m or CAA Division BB section 201. Describing it only as "the No Surprises Act" or only citing the PHSA provision does not pass.
- id: c02
  category: issue_spotting
  deliverable: memo.md
  text: Concludes that Section 9.4's requirement of Meridian's prior written consent before the Plan shares claims data with consultants or auditors is a prohibited restriction under section 724(a)(1)(C) on sharing data with, or directing that data be shared with, a business associate.
  grader_notes: The Departments' FAQs (Part 57 Q2; Part 69 Q7) treat access or sharing that is subject to the TPA's discretion or consent as the paradigm gag clause. A memo that calls 9.4 merely "problematic" or "aggressive" without concluding it is prohibited fails.
- id: c03
  category: issue_spotting
  deliverable: memo.md
  text: Concludes that Section 9.5's bar on the Plan Sponsor disclosing provider-specific reimbursement rates, allowed amounts, or provider quality ratings to participants, network providers, or referring providers is prohibited by section 724(a)(1)(A).
  grader_notes: Section 724(a)(1)(A) protects providing provider-specific cost or quality information to referring providers, the plan sponsor, participants, beneficiaries and eligible individuals. Meridian's member-portal cost estimates do not cure a restriction on the Plan itself.
- id: c04
  category: legal_analysis
  deliverable: memo.md
  text: Explains that the section 724(a)(2) exception for "reasonable restrictions on the public disclosure" applies only to the provider-specific cost and quality information described in paragraph (1)(A) and therefore cannot be used to justify restrictions on access to or sharing of de-identified claims data under (1)(B) or (1)(C).
  grader_notes: Many answers either ignore (a)(2) or treat it as a general reasonableness exception. Pass only if the memo both notes the exception is limited to (1)(A) information and draws the consequence that it does not reach (B)/(C) data access or sharing. Noting that the "or the public" portion of 9.5 may be preserved is good but not required.
- id: c05
  category: issue_spotting
  deliverable: memo.md
  text: Concludes that Section 9.6's audit limits (once per plan year, a sample capped at 250 claims selected by Meridian's methodology, on Meridian's premises or a view-only portal) are impermissible restrictions on electronic access to de-identified claims data, not merely commercially unfavorable terms.
  grader_notes: FAQs Part 69 Q8 lists limiting access to a "statistically significant" sample, limiting frequency of claims reviews, limiting scope to a specific audit, and on-premises-only access as prohibited. The memo need not cite the FAQ by number but must reach the conclusion that these limits are prohibited restrictions.
- id: c06
  category: legal_analysis
  deliverable: memo.md
  text: Acknowledges that section 724 and the Departments' guidance do not prescribe a required format, delivery mechanism, turnaround time, or price for electronic access, and accordingly frames the fee, 180-day lag, and standard-format terms of Section 9.3 as a question of whether they "directly or indirectly restrict" access rather than asserting that any fee or delay is a per se violation.
  grader_notes: This is the calibration criterion. FAIL if the memo asserts flatly that charging any fee, or any delay, or any format limitation is automatically unlawful, or if it asserts that the statute requires raw per-claim extracts in a particular format or at no charge. PASS requires the memo to say explicitly that the statute/guidance are silent on format, mechanism, timing and price (or words to that effect) and then analyze the terms under the "directly or indirectly restrict" standard.
- id: c07
  category: legal_analysis
  deliverable: memo.md
  text: Concludes that the Section 9.3 terms, taken together (claim-level allowed amounts and provider identifiers available only as a paid "custom extract" at $18,500 plus $0.11 per line, a 180-day delivery window running from an acceptance for which there is no deadline, and Meridian's right to decline extracts that would reveal "Proprietary Information"), operate as an indirect restriction on per-claim access to the data elements section 724(a)(1)(B) expressly lists, and are therefore likely prohibited.
  grader_notes: The point is that the enumerated per-claim elements (allowed amount, provider name/clinical designation, service codes) are precisely the ones Meridian excludes from standard access and reserves the right to decline. A memo that treats portal access to aggregated data as satisfying (B), or that leaves 9.3 as "probably fine" because the statute is silent on price, fails. A memo that flags the open-ended acceptance period as compounding the lag is a strong signal but not required.
- id: c08
  category: legal_analysis
  deliverable: memo.md
  text: States that Meridian's classification of allowed amounts and provider-specific rates as "Meridian Proprietary Information" cannot override section 724, because the statute expressly lists allowed amounts and provider name and clinical designation among the per-claim elements the Plan must be able to access.
  grader_notes: FAQs Part 57 Q2 rejects a TPA's "proprietary" label as a basis for restricting disclosure. The memo must connect the proprietary-information argument to the statutory enumeration (or the Departments' rejection of the proprietary argument) and reject it.
- id: c09
  category: legal_analysis
  deliverable: memo.md
  text: Correctly explains that "de-identified" in section 724(a)(1)(B) refers to removal of participant and beneficiary identifiers under the HIPAA de-identification standard (45 C.F.R. 164.514), and does not suggest that provider identities, provider NPIs, or provider-level pricing must or may be removed to make the data "de-identified."
  grader_notes: Trap. Some answers suggest Meridian may strip provider identifiers or allowed amounts as part of de-identification. That fails. A memo that says de-identification concerns members/participants (HIPAA safe harbor or expert determination) and that provider-level fields remain in scope passes. A citation to 164.514 is not strictly required if the HIPAA standard is clearly described.
- id: c10
  category: legal_analysis
  deliverable: memo.md
  text: Explains that section 724 is directed at the Plan (the Plan "may not enter into" an agreement containing such restrictions) so that compliance and attestation exposure rests with the Plan and its fiduciaries regardless of who drafted the ASA or what Meridian's compliance team has represented, and does not describe Meridian as the party that is itself in violation of section 724.
  grader_notes: Meridian is the counterparty, not a regulated plan or issuer here (a TPA for a self-funded plan). Pass if the memo places the obligation on the Plan/Halvorsen and does not state that Meridian is violating 724. A memo may note Meridian has contractual or reputational exposure; that is fine.
- id: c11
  category: legal_analysis
  deliverable: memo.md
  text: Advises that the Section 9.7 compliance-with-law savings clause does not cure the prohibited provisions for attestation purposes, and recommends that the offending language be amended or deleted rather than relying on Section 9.7.
  grader_notes: Reasons that pass include - the savings clause is triggered only on a determination by a court or governmental authority; the provisions remain operative and Meridian is in fact applying them; the Departments expect plans to remove or report prohibited provisions, not neutralize them with boilerplate. A memo that accepts Meridian's "no gag clause by definition" argument fails.
- id: c12
  category: recommendation
  deliverable: memo.md
  text: Flags that the December 2024 and December 2025 attestations were submitted as unqualified "in compliance" attestations while Article 9 was in force, identifies this as a compliance exposure for the Plan, and recommends a documented remediation approach for the prior attestations (for example documenting the reliance on Meridian's confirmation, correcting the record with the Departments or in the next attestation's Additional Information field, and preserving a remediation file).
  grader_notes: The memo must do all three - flag the prior attestations as inaccurate/at risk, call it an exposure, and recommend a concrete course of action. It should NOT assert that a formal "amended attestation" mechanism definitely exists, nor that prior attestations are simply irrelevant. Recommending consideration of voluntary disclosure or supplementing in the next attestation is sufficient.
- id: c13
  category: recommendation
  deliverable: memo.md
  text: Advises that Halvorsen must still submit the attestation due December 31, 2026 and, if Meridian has not amended Article 9 by then, must disclose the non-compliant provisions and the steps taken to remove them in the attestation's "Additional Information" field, consistent with the Departments' FAQ guidance, rather than skipping the attestation or attesting unqualified compliance.
  grader_notes: FAQs Part 69 Q9. Pass requires - submit anyway; use the Additional Information disclosure if unremediated; do not attest unqualified compliance. A memo recommending that Halvorsen not file until the contract is fixed fails.
- id: c14
  category: recommendation
  deliverable: memo.md
  text: Recommends that the Plan put HIPAA business associate agreements in place with Northgate and Claimsight (or confirm their business associate status) and direct Meridian to furnish the de-identified data to them, and concludes that Meridian cannot rely on the "Competitor" definition or its consent right in Section 9.4 to block sharing with a business associate.
  grader_notes: Section 724(a)(1)(C) protects sharing with, or directing that data be shared with, a business associate. The memo may acknowledge Meridian could seek reasonable confidentiality protections for its rates from the recipients; it must still conclude the Competitor carve-out cannot be used to refuse sharing.
- id: c15
  category: recommendation
  deliverable: memo.md
  text: Proposes amendment terms for Article 9 that (a) delete the consent requirement for sharing with the Plan's business associates and (b) specify the per-claim data elements to be furnished, expressly including allowed amounts and provider names or identifiers.
  grader_notes: Both (a) and (b) must appear in the proposed amendment. Replacing consent with a requirement that recipients execute a BAA / reasonable confidentiality undertaking is acceptable for (a).
- id: c16
  category: recommendation
  deliverable: memo.md
  text: Proposes amendment terms that address timing and cost of data access, by specifying a defined reasonable delivery timeframe for claim-level extracts and limiting any charge to a reasonable cost-based fee (or no fee for standard electronic access).
  grader_notes: Pass if the memo proposes both a timeframe (a specific number of days or "promptly / within a defined period") and a fee limitation. A memo that proposes only "reasonable terms" with no specifics fails.
- id: c17
  category: recommendation
  deliverable: memo.md
  text: Recommends that the amendment require Meridian to represent that none of its downstream agreements (including Meridian Choice network provider contracts) restricts the Plan's rights under section 724, or otherwise addresses the risk that a downstream Meridian agreement could indirectly restrict the Plan.
  grader_notes: FAQs Part 69 Q6 - a TPA's downstream agreement can put the plan in violation, and the Departments expect plans to include provisions addressing it. A memo that mentions the downstream-agreement risk and recommends a representation, covenant, or diligence step passes.
- id: c18
  category: legal_analysis
  deliverable: memo.md
  text: Connects the data request to the Committee's ERISA fiduciary duties, explaining that the duty to prudently select and monitor service providers and to ensure plan expenses are reasonable supports obtaining the claims data, and recommends that the Committee document its efforts.
  grader_notes: Must mention the monitoring duty (or prudence duty regarding service providers and plan expenses) and recommend documenting. A memo that merely says "the Committee should get the data" without the fiduciary framing fails.
- id: c19
  category: legal_analysis
  deliverable: memo.md
  text: Identifies potential excise tax exposure under Internal Revenue Code section 4980D ($100 per day per affected individual) for a group health plan's failure to satisfy the Code's parallel gag clause provision (IRC 9824), as part of the Plan Sponsor's exposure analysis.
  grader_notes: IRC 9824 sits in Chapter 100 and 4980D applies to Chapter 100 failures; self-reporting is on Form 8928. The memo must name 4980D or describe the $100/day/individual excise tax. Describing the exposure as theoretical or noting the absence of reported enforcement is fine.
- id: c20
  category: fact_use
  deliverable: memo.md
  text: Notes that the 90-day non-renewal notice deadline under Section 12.1 (October 2, 2026) has passed, so the ASA will renew for calendar 2027, and factors this into the recommended negotiating approach (for example relying on Meridian's exposure to a reported gag clause and the Plan's fiduciary posture rather than on a non-renewal threat, or considering Section 12.2 breach-based termination).
  grader_notes: Must both identify that the notice window has passed / the agreement renews for 2027, and adjust the negotiating approach accordingly.
- id: c21
  category: negative
  polarity: negative
  deliverable: memo.md
  text: Relies on the Section 12.4 "Changes in Law" clause as the mechanism that obligates Meridian to amend the ASA, even though section 724 was enacted in December 2020 and is not a change in law enacted after the January 1, 2024 Effective Date.
  grader_notes: Negative criterion. PASS if the memo does not invoke 12.4 as the lever, or expressly explains why 12.4 does not apply. FAIL if the memo recommends invoking 12.4 or states that Meridian is obligated under 12.4 to negotiate the amendment.
- id: c22
  category: format
  deliverable: memo.md
  text: Is formatted as a memorandum addressed to Dana Okafor and opens with an executive summary that states the bottom-line conclusions before the detailed analysis.
